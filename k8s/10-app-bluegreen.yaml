# Blue-Green: two identical Deployments (blue / green). Only one receives live traffic.
# Jenkins deploys the new version to the idle colour, tests it on the preview port (30081),
# and after approval flips the live Service (30080) to the new colour.
# Both start at 0 replicas - the first Jenkins build brings the app up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-app-blue
  namespace: healthcare
spec:
  replicas: 0
  selector:
    matchLabels: { app: patient-app, slot: blue }
  template:
    metadata:
      labels: { app: patient-app, slot: blue }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: localhost:5000/patient-app:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: SLOT, value: blue }
            - { name: APP_VERSION, value: "0" }
            - { name: DB_HOST, value: postgres }
            - { name: DB_NAME, valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_DB } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-app-green
  namespace: healthcare
spec:
  replicas: 0
  selector:
    matchLabels: { app: patient-app, slot: green }
  template:
    metadata:
      labels: { app: patient-app, slot: green }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: localhost:5000/patient-app:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: SLOT, value: green }
            - { name: APP_VERSION, value: "0" }
            - { name: DB_HOST, value: postgres }
            - { name: DB_NAME, valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_DB } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# LIVE traffic -> http://<EC2-IP>:30080
apiVersion: v1
kind: Service
metadata:
  name: patient-app
  namespace: healthcare
spec:
  type: NodePort
  selector: { app: patient-app, slot: blue }
  ports:
    - { port: 80, targetPort: http, nodePort: 30080 }
---
# PREVIEW of the idle colour -> http://<EC2-IP>:30081
apiVersion: v1
kind: Service
metadata:
  name: patient-app-preview
  namespace: healthcare
spec:
  type: NodePort
  selector: { app: patient-app, slot: green }
  ports:
    - { port: 80, targetPort: http, nodePort: 30081 }
